version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: auction_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/auction_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  realtime:
    build: ./realtime
    command: npm start
    volumes:
      - ./realtime:/app
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=4000
    depends_on:
      - redis
